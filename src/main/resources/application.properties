# Configuración del servidor
server.port=8081
spring.application.name=Liga de Fútbol

# Configuración de Neo4j
spring.neo4j.uri=neo4j://127.0.0.1:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=neo4j123

# Configuración de H2 Database (comentada temporalmente)
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=password
# spring.h2.console.enabled=true
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.jpa.hibernate.ddl-auto=create-drop

# Logging
logging.level.org.springframework.data.neo4j=DEBUG
logging.level.com.uade.ligafutbol=DEBUG
logging.level.org.springframework.boot.autoconfigure=DEBUG
logging.level.root=INFO
# Incluir stacktrace en la respuesta de error para facilitar debugging (requiere reinicio)
server.error.include-stacktrace=ALWAYS

# Neo4j configuración adicional
spring.neo4j.pool.max-connection-lifetime=PT30S
spring.neo4j.pool.max-connection-pool-size=10
spring.neo4j.pool.connection-acquisition-timeout=PT30S
