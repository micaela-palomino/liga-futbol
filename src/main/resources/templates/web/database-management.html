<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informacion del sistema - Liga Fútbol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .database-hero {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            border-radius: 15px;
        }
        .step-card {
            transition: all 0.3s ease;
            border: 2px solid #e9ecef;
        }
        .step-card:hover {
            border-color: #28a745;
            transform: translateY(-2px);
        }
        .step-number {
            background: linear-gradient(45deg, #28a745, #20c997);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .result-area {
            max-height: 400px;
            overflow-y: auto;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
        }
        .loading {
            display: none;
        }
        .success-message {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
        }
        .error-message {
            background: linear-gradient(45deg, #dc3545, #fd7e14);
            color: white;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/web/">
                <i class="fas fa-database me-2"></i>🗄️ Informacion del sistema ⚽
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/web/">
                    <i class="fas fa-home"></i> 🏠 Volver al Campo Principal
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="database-hero p-4">
                    <div class="row align-items-center">
                        <div class="col-md-8">
                            <h1><i class="fas fa-database"></i> 🗄️ Informacion del sistema</h1>
                            <p class="mb-0">
                                🏗️ Crea las tablas, llena la información y arma las consultas de la Liga de Fútbol.
                                Sistema completo de gestión de datos Neo4j desde el backend.
                            </p>
                        </div>
                        <div class="col-md-4 text-center">
                            <i class="fas fa-database fa-4x opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Current Stats -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5><i class="fas fa-chart-bar"></i> 📊 Estado Actual de la Base de Datos</h5>
                    </div>
                    <div class="card-body" id="statsArea">
                        <div class="d-flex justify-content-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load initial stats
        document.addEventListener('DOMContentLoaded', function() {
            cargarEstadisticas();
        });

        function cargarEstadisticas() {
            fetch('/web/database/estadisticas')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        const stats = data.estadisticas;
                        document.getElementById('statsArea').innerHTML = `
                            <div class="row text-center">
                                <div class="col-md-3">
                                    <h4 class="text-primary">${stats.total_equipos || 0}</h4>
                                    <p class="mb-0">⚽ Equipos</p>
                                </div>
                                <div class="col-md-3">
                                    <h4 class="text-success">${stats.total_estadios || 0}</h4>
                                    <p class="mb-0">🏟️ Estadios</p>
                                </div>
                                <div class="col-md-3">
                                    <h4 class="text-warning">${stats.total_partidos || 0}</h4>
                                    <p class="mb-0">🏆 Partidos</p>
                                </div>
                                <div class="col-md-3">
                                    <small class="text-muted">📅 ${new Date().toLocaleString()}</small>
                                    <p class="mb-0">Última actualización</p>
                                </div>
                            </div>
                        `;
                    } else {
                        document.getElementById('statsArea').innerHTML = `
                            <div class="alert alert-warning">
                                ⚠️ No se pudieron cargar las estadísticas. La BD podría estar vacía.
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    document.getElementById('statsArea').innerHTML = `
                        <div class="alert alert-danger">
                            ❌ Error cargando estadísticas: ${error.message}
                        </div>
                    `;
                });
        }
    </script>
</body>
</html>
